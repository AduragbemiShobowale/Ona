.phone .bd>*{flex-shrink:0}

// ---------- guide ----------
function guide(){
  const o=O(),rt=S.route,st=rt&&rt.stops[1];let n,m,t,tab;
  if(!o){n=1;m="As <b>Business owner</b>, create order #1042: items from stock, a delivery slot, and let the customer choose the address.";t="owner";tab="new"}
  else if(o.status==="Awaiting address"){n=2;m="In the <b>Customer app</b>, sign in and choose where to deliver.";t="cust"}
  else if(o.status==="Received"){n=3;m="As <b>Business owner</b> (Orders), pack #1042, then tick it <b>and</b> #1043 and request dispatch for both.";t="owner";tab="orders"}
  else if(["Awaiting payment","Payment rejected"].includes(o.status)){n=4;m="Pay the total for both orders with one transfer and <b>upload one receipt</b>.";t="owner";tab="orders"}
  else if(o.status==="Payment check"){n=5;m="As <b>Super admin</b> → Payments, check the receipt and confirm. Target: within 15 minutes.";t="super";tab="payments"}
  else if(o.status==="Ready for pickup"&&!rt){n=6;m="In <b>Operations</b> → Dispatch, accept the suggested 3-order route and assign a bike rider.";t="ops";tab="dispatch"}
  else if(rt&&!rt.accepted){n=7;m="In the <b>Rider app</b>, accept the route.";t="rider"}
  else if(o.status==="Rider assigned"){n=8;m="In the <b>Rider app</b>, tap <b>Arrived at shop</b> at Adunni Boutique.";t="rider"}
  else if(o.status==="Rider at shop"){n=9;m="Rider is waiting. Try <b>skip 5 min</b> to see the ₦200 waiting charge, then the owner reads the <b>pickup code</b> and the rider photographs the bags and enters it.";t="owner";tab="orders"}
  else if(o.status==="Failed pickup"){n=9;m="Failed pickup recorded against the business. Press <b>Restart demo</b> to run the main path.";t="ops";tab="trips"}
  else if(o.status==="Out for delivery"&&S.swap&&!S.swap.done){n=10;m="Rider change in progress: in the <b>Rider app</b>, switch to Musa's phone and type Sunday's <b>handover code</b>.";t="rider"}
  else if(o.status==="Out for delivery"&&o.t<1){n=10;m="Watch the <b>Customer app</b>: live map and a traffic notice. Optional: in <b>Operations</b> → Trips, swap the rider to see the handover.";t="cust"}
  else if(o.status==="Out for delivery"){n=11;m="At the door: rider photographs the handover and types the <b>delivery code</b> from the <b>Customer app</b>.";t="rider"}
  else if(o.status==="Delivered"&&!o.rating&&!o.problem){n=12;m="In the <b>Customer app</b>, rate, or report the tote as damaged to open a <b>claim</b>.";t="cust"}
  else if(S.claim&&!S.claim.decision){n=12;m="In <b>Operations</b> → Disputes &amp; claims, compare the pickup and door photos and decide who caused it.";t="ops";tab="disputes"}
  else{n=13;m="Done. Super admin sees revenue and riders; the owner sees the claim outcome, waiting charge and performance.";t="super";tab="overview"}
  $("#gstep").textContent=`Live order · step ${n} of 13`;$("#gmsg").innerHTML=m;return {t,tab};
}

// ---------- Customer ----------
function vCust(){const o=O(),c=S.cust;let body;
  if(!c.logged){body=`${o?`<div class="email"><div class="from">Adunni Boutique via Ọ̀nà</div><p style="margin:6px 0 0">Adunni Boutique has sent you order #1042 for today, 4–6pm. Sign in to choose the address and follow it.</p></div>`:`<div class="notice">No email yet.</div>`}<div style="font-size:18px;font-weight:800;margin-top:6px">Sign in</div><label class="f" for="em">Email<input id="em" value="ngozi@example.com"></label><label class="f" for="pw">Password<input id="pw" type="password" value="demo-password"></label><button class="b pri full" data-act="login">Sign in</button>`;return cwrap(body,false)}
  if(c.tab==="addresses")body=`<div style="font-size:18px;font-weight:800">Saved addresses</div>${S.addresses.map(a=>`<div class="card"><b>${a.label}</b><div class="small">${esc(a.street)}, ${esc(a.area)}</div></div>`).join("")}`;
  else if(c.tab==="account")body=`<div style="font-size:18px;font-weight:800">Account</div><div class="card"><b>Ngozi Okafor</b><div class="small mono">ngozi@example.com</div></div><div class="card"><b>Businesses that can send you orders</b><div class="small">Adunni Boutique · Mama Tee Bakery</div></div>`;
  else if(c.view==="order"&&o)body=cOrder(o);
  else body=`<div style="font-size:18px;font-weight:800">My orders</div>${o?`<button class="ocard" data-act="openorder"><div class="row" style="justify-content:space-between"><b>Adunni Boutique · #1042</b>${sp(o.status==="Awaiting address"?"Choose address":o.status)}</div><div class="small muted">Today 4–6pm</div></button>`:""}<div class="ocard" style="cursor:default"><b>Mama Tee Bakery · #2190</b> ${pill("Delivered","p-ok")}</div>`;
  return cwrap(body,true)}
function cOrder(o){const r=curRider(),v=r&&V(r.veh);
  const steps=[["Order placed",o.createdAt],["Address confirmed",o.addrAt],["Packed",o.packedAt],["Paid and handed to Ọ̀nà",o.readyAt],["Rider assigned",o.acceptedAt?o.acceptedAt+" · "+R(S.route.rider).name:null],["Picked up",o.pickupAt],["Delivered",o.deliveredAt]];const di=steps.filter(x=>x[1]).length;
  let top="";
  if(o.status==="Awaiting address")top=`<b>Where should Adunni Boutique deliver?</b>${S.addresses.map((a,i)=>`<label class="addr" for="ad${a.id}"><input type="radio" name="ad" id="ad${a.id}" value="${a.id}" ${i===0?"checked":""}><div><b>${a.label}</b><div class="small">${esc(a.street)}, ${esc(a.area)} · ${a.km} km</div></div></label>`).join("")}<button class="b pri full" data-act="chooseaddr">Use this address</button>`;
  if(o.status==="Rider at shop")top=`<div class="notice">Your rider is collecting your order from Adunni Boutique.</div>`;
  if(o.status==="Failed pickup")top=`<div class="notice warn">Short delay at the shop. Adunni Boutique will confirm a new time.</div>`;
  if(o.status==="Out for delivery"){top=`${S.cong?`<div class="notice warn"><b>Heavy traffic on the Lekki–Epe Expressway.</b> New estimate ${eta(o)}, still within your 4–6pm window.</div>`:""}${S.swap&&S.swap.done?`<div class="notice">Your rider has changed to <b>Musa Bello</b> (${esc(S.swap.reason.toLowerCase())}). Your delivery code stays the same.</div>`:""}${map()}<div class="eta"><span>Estimated arrival</span><b>${eta(o)}</b></div>`}
  if(r&&S.route.accepted&&!["Delivered","Failed pickup"].includes(o.status))top+=`<div class="ridercard"><div class="avatar">${esc(r.short[0])}</div><div><b>${esc(r.name)}</b><div class="small mono">${esc(r.phone)}</div><div class="small"><span class="veh">${v.type} · ${v.plate}</span></div></div>${pill("Call","p-ok")}</div>`;
  if(o.status==="Out for delivery")top+=`<div class="small"><b>Check your items</b>, then give the rider this code:</div><ul class="items">${o.lines.map(l=>`<li><label class="chk"><input type="checkbox"> ${esc(prod(l.pid).name)}</label><span class="mono">×${l.qty}</span></li>`).join("")}</ul><div class="code">${o.code.split("").join(" ")}</div>`;
  let after="";
  if(o.status==="Delivered")after=o.rating||o.problem?`<div class="notice">${o.rating?`Rated ${o.rating}★. `:""}${o.problem?`Reported: ${esc(o.problem.type)}. ${S.claim?(S.claim.decision==="rider"?"Ọ̀nà took responsibility; Adunni Boutique will replace it.":S.claim.decision==="store"?"Adunni Boutique will sort this out with you.":"Ọ̀nà is checking the photos."):o.problem.toBiz?"Sent to Adunni Boutique.":"Sent to Ọ̀nà."}`:""}</div>`:
   `<b>How was it?</b><div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="rate" data-n="${n}" aria-label="${n} stars">★</button>`).join("")}</div>
    <details><summary class="small" style="font-weight:700;cursor:pointer">Report a problem</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><label class="f" for="ctype">What went wrong<select id="ctype"><option>Item damaged</option><option>Item missing</option><option>Wrong item</option><option>Late delivery</option><option>Rider conduct</option></select></label><label class="f" for="ctext">Details<textarea id="ctext" rows="2">One handle on the tote is torn.</textarea></label><button class="b full" data-act="complain">Send</button><p class="small muted" style="margin:0">Damage: within 48 h. Missing items: within 24 h.</p></div></details>`;
  return `<button class="b" data-act="back" style="align-self:flex-start">← My orders</button><div><div class="small muted">Adunni Boutique · #1042 · today 4–6pm</div><div style="font-size:18px;font-weight:800">${esc(o.status)}</div></div>${top}${after}<ul class="timeline">${steps.map((x,i)=>`<li class="${i<di?"done":i===di?"now":"todo"}"><span class="d"></span><div><div class="tt">${x[0]}</div><div class="ts">${x[1]||""}</div></div></li>`).join("")}</ul>`}
function cwrap(body,tb){const c=S.cust;return `<div class="stage"><div class="phone"><div class="sb"><span>${now()}</span><span>Wi-Fi ▮▮▮</span></div><div class="ab cust"><span>Ọ̀nà</span><span>${c.logged?"Ngozi":""}</span></div><div class="bd">${body}</div>${tb?`<div class="ptabs">${[["orders","Orders"],["addresses","Addresses"],["account","Account"]].map(([k,l])=>`<button aria-pressed="${c.tab===k}" data-ctab="${k}">${l}</button>`).join("")}</div>`:""}</div>
  <div class="notes"><h1>Customer app</h1><p class="sub">Gets orders from businesses, chooses the address, follows the rider, gives the delivery code. Told automatically about traffic delays and rider changes, so nobody has to chase anyone.</p></div></div>`}

// ---------- events ----------
function bind(){
  const em=$("#nem");if(em){const f=()=>{const d=(em.value.split("@")[1]||"").toLowerCase();$("#nhint").textContent=TYPO[d]?`Did you mean ${em.value.split("@")[0]}@${TYPO[d]}?`:""};em.oninput=f;f()}
  if($("#np")){const u=m=>{const p=prod(+$("#np").value);$("#na").textContent=avail(p)+" available";if(!m)$("#nveh").value=p.size==="Large"?"Van":"Bike";$("#nfee").textContent=naira(fee($("#nveh").value,"0–5 km"))};$("#np").onchange=()=>u();$("#nveh").onchange=()=>u(true);u()}
}
let chosenSlot="4–6pm";
document.addEventListener("click",e=>{
  const rb=e.target.closest("[data-role]");if(rb){role=rb.dataset.role;const g=guide();if(g.t===role&&g.tab)tabs[role]=g.tab;render();return}
  const tb=e.target.closest("[data-tab]");if(tb){const [r,k]=tb.dataset.tab.split(":");tabs[r]=k;render();return}
  const ct=e.target.closest("[data-ctab]");if(ct){S.cust.tab=ct.dataset.ctab;S.cust.view="list";render();return}
  const b=e.target.closest("[data-act]");if(!b)return;const o=O(),rq=S.request,rt=S.route;
  const H={
   slot:()=>{chosenSlot=b.dataset.s;document.querySelectorAll(".slot").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===chosenSlot));return true},
   create:()=>{const p=prod(+$("#np").value),q=+$("#nq").value;if(q>avail(p)){toast(`Only ${avail(p)} available`);return}p.res+=q;S.moves.push([now(),p.name.replace(" · green",""),"reserve +"+q,"Order #1042"]);
     S.orders[1042]={id:1042,biz:1,name:$("#nnm").value,email:$("#nem").value,phone:$("#nph").value,lines:[{pid:p.id,qty:q}],slot:chosenSlot,veh:$("#nveh").value,band:"0–5 km",fee:fee($("#nveh").value,"0–5 km"),status:"Awaiting address",createdAt:now(),t:0};
     S.live=true;tabs.owner="orders";toast("Order #1042 sent. Ngozi will be emailed.")},
   login:()=>{S.cust.logged=true;if(o)S.cust.view="order"},openorder:()=>{S.cust.view="order"},back:()=>{S.cust.view="list"},
   chooseaddr:()=>{const a=S.addresses.find(x=>x.id===+document.querySelector('input[name="ad"]:checked').value);o.address=a;o.band=a.km<=5?"0–5 km":"5–15 km";o.fee=fee(o.veh,o.band);o.status="Received";o.addrAt=now();toast(`Address shared. ${a.km} km → ${o.band}, fee ${naira(o.fee)}.`)},
   pack:()=>{const l=o.lines[0],p=prod(l.pid);p.res-=l.qty;p.on-=l.qty;S.moves.push([now(),p.name.replace(" · green",""),"pick −"+l.qty,"Order #1042 packed"]);o.bags=Math.max(1,+$("#bags").value||1);o.status="Packed";o.packedAt=now();toast("Packed. Now request dispatch.")},
   request:()=>{const ids=[...document.querySelectorAll(".rqs:checked")].map(x=>+x.value);if(!ids.includes(1042)){toast("Keep #1042 ticked for the demo");return}S.request={ids,total:ids.reduce((s,i)=>s+S.orders[i].fee,0),tries:0,status:"pay",waited:0};ids.forEach(i=>S.orders[i].status="Awaiting payment");toast(`Dispatch requested for ${ids.length} orders. One transfer of ${naira(S.request.total)}.`)},
   upload:()=>{const ref=$("#pref").value.trim();if(!ref){toast("Enter the reference");return}const f=$("#rcpt").files[0];rq.ref=ref;rq.tries++;rq.at=now();rq.receipt=null;rq.waited=3;
     const done=()=>{rq.status="check";rq.ids.forEach(i=>S.orders[i].status="Payment check");toast("Receipt sent.");render()};
     if(f&&f.type.startsWith("image/")){const r=new FileReader();r.onload=()=>{rq.receipt=r.result;done()};r.onerror=done;r.readAsDataURL(f);return true}done();return true},
   waitrq:()=>{rq.waited+=10},
   confirmpay:()=>{rq.ok=true;rq.status="ok";rq.okAt=now();rq.ids.forEach(i=>{const x=S.orders[i];x.paid=true;x.status="Ready for pickup";x.readyAt=now()});toast(`Confirmed in ${rq.waited} min. ${rq.ids.length} orders released to Operations.`)},
   rejectpay:()=>{rq.reason=$("#rj").value;if(rq.tries>=3){rq.ids.forEach(i=>S.orders[i].status="Packed");S.request=null;toast("Third rejection: request closed.")}else{rq.status="pay";rq.ids.forEach(i=>S.orders[i].status="Payment rejected");toast("Rejected with reason.")}},
   batch:()=>{S.route={ids:[3051,1042,1043],rider:null,accepted:false,stops:[{done:false},{wait:0,extra:false}]};toast("Route accepted. Assign a bike rider.")},
   nobatch:()=>{toast("Kept separate (demo continues with the suggested route).")},
   assign:()=>{rt.rider=+b.dataset.r;toast(`Offered to ${R(rt.rider).short}.`)},
   declineroute:()=>{rt.rider=null;toast("Declined. Back to Operations.")},
   accept:()=>{rt.accepted=true;R(rt.rider).status="On a trip";rt.ids.forEach(i=>S.orders[i].status=i===3051?"Rider assigned":"Rider assigned");o.acceptedAt=now();o.pcode=String(1000+Math.floor(Math.random()*9000));toast("Route accepted.")},
   arrive:()=>{o.status="Rider at shop";S.orders[1043].status="Rider at shop";o.arriveAt=now();toast("Owner told: rider at your door. 10 free minutes start.")},
   skip:()=>{rt.stops[1].wait+=5},
   extra:()=>{rt.stops[1].extra=true;toast("Rider told: 10 more minutes. Waiting charge still applies after the free 10.")},
   photo:()=>{if(b.dataset.k==="pick"){o.pickPhoto=true;o.pickPhotoAt=now()}else{o.doorPhoto=true;o.doorPhotoAt=now()}toast("Photo saved with time and location.")},
   pcode:()=>{if($("#pcode").value.trim()!==o.pcode){toast("Wrong pickup code.");return}o.status="Out for delivery";S.orders[1043].status="Out for delivery";o.pickupAt=now();o.code=String(1000+Math.floor(Math.random()*9000));o.t=0;
     const w=rt.stops[1].wait;if(w>10)S.request.waiting=wcharge(w);ride();toast(w>10?`Picked up. Waiting charge ${naira(wcharge(w))} added to Adunni's next payment.`:"Picked up. Customer sees the map and code.")},
   failpick:()=>{o.failReason=$("#fp").value;o.status="Failed pickup";S.orders[1043].status="Failed pickup";toast("Failed pickup recorded (business). Rider continues the route.")},
   swap:()=>{S.swap={reason:$("#swr").value,code:String(1000+Math.floor(Math.random()*9000)),done:false};clearInterval(timer);riderView=1;toast("Musa sent to Sunday. Sunday's app now shows a handover code.")},
   rv:()=>{riderView=+b.dataset.v},
   handover:()=>{if($("#hcode").value.trim()!==S.swap.code){toast("Wrong handover code.");return}S.swap.done=true;S.swap.at=now();R(1).status="Available";R(2).status="On a trip";ride();toast("Handover confirmed. Business and customer told about the new rider.")},
   code:()=>{if(S.locked)return;if($("#code").value.trim()===o.code){o.status="Delivered";o.deliveredAt=now();toast("Delivered.")}else{o.wrong=(o.wrong||0)+1;if(o.wrong>=5){S.locked=true;toast("Locked. Operations notified.")}else toast("Wrong delivery code.")}},
   override:()=>{const r=$("#ovr").value.trim();if(r.length<10){toast("Give a reason of 10+ characters");return}o.status="Delivered";o.deliveredAt=now();o.override=r;S.locked=false;if(!o.doorPhoto){o.doorPhoto=true;o.doorPhotoAt=now()}toast("Recorded as delivered by Operations. Logged.")},
   rate:()=>{o.rating=+b.dataset.n;toast("Thanks.")},
   complain:()=>{const t=$("#ctype").value,txt=$("#ctext").value.trim();o.problem={type:t,text:txt,toBiz:["Item missing","Wrong item"].includes(t)};if(t==="Item damaged"){S.claim={item:prod(o.lines[0].pid).name,text:txt,at:now()};toast("Claim opened. Ọ̀nà will compare the pickup and door photos.")}else toast(o.problem.toBiz?"Sent to Adunni Boutique.":"Sent to Ọ̀nà.")},
   claim:()=>{const d=b.dataset.d;S.claim.decision=d;S.claim.decisionText=d==="rider"?"Rider-caused: bags were intact at pickup. ₦12,000 refunded to Adunni Boutique; recorded against the rider.":"Store-caused: the pickup photo shows the handle already damaged. Sent to Adunni Boutique to resolve with the customer; logged as a packing issue.";toast(S.claim.decisionText)},
   prompt:()=>{S.issues.find(i=>i.id===b.dataset.i).done=true;toast("Prompt sent.")},
   pause:()=>{const r=R(+b.dataset.r);r.status=r.status==="Paused"?"Available":"Paused";toast(r.status==="Paused"?`${r.short} paused.`:`${r.short} available.`)},
   addrider:()=>{const n=$("#rn").value.trim(),p=$("#rp").value.trim();if(!n||!p){toast("Name and phone needed");return}S.riders.push({id:S.riders.length+1,name:n,short:n.split(" ")[0],phone:p,veh:4,status:"Available",del:0,ontime:0,rating:0,comp:0,docs:"Licence to "+$("#rl").value,pay:0});toast(`${n} created with a temporary password.`)},
   adddisp:()=>{const n=$("#dn").value.trim();if(!n){toast("Enter a name");return}S.staff.push([n,"Dispatch staff"]);toast("Dispatch account created.")},
   addops:()=>{const n=$("#sn").value.trim();if(!n){toast("Enter a name");return}S.staff.push([n,"Operations"]);toast("Operations account created.")},
   addbiz:()=>{const n=$("#bn").value.trim();if(!n){toast("Enter a name");return}toast(`${n} created. Owner emailed a set-password link.`)},
  };
  if(H[b.dataset.act]){const keep=H[b.dataset.act]();if(!keep)render()}
});
function ride(){clearInterval(timer);timer=setInterval(()=>{const o=O();o.t=Math.min(1,o.t+0.05);if(o.t>=0.4&&!S.cong){S.cong=true}if(o.t>=1)clearInterval(timer);if(["cust","rider"].includes(role)||(role==="owner"&&tabs.owner==="orders")||(role==="ops"&&["dispatch","trips"].includes(tabs.ops)))render();else guide()},1000)}
$("#reset").onclick=()=>{clearInterval(timer);S=fresh();start=Date.now();role="owner";tabs={super:"overview",ops:"dispatch",owner:"new"};riderView=1;chosenSlot="4–6pm";render();toast("Demo restarted")};
render();
})();
</script>
